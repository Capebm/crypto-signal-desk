[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."hunt-opportunities"]
  timeout = 26

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search-opportunities"
  status = 200

[[redirects]]
  from = "/api/hunt"
  to = "/.netlify/functions/hunt-opportunities"
  status = 200

[[redirects]]
  from = "/api/estimate"
  to = "/.netlify/functions/hunt-opportunities"
  status = 200

[[redirects]]
  from = "/api/yahoo-candles"
  to = "/.netlify/functions/yahoo-candles"

[[redirects]]
  from = "/api/yahoo-pack"
  to = "/.netlify/functions/yahoo-pack"
  status = 200

[[redirects]]
  from = "/api/twelve-pack"
  to = "/.netlify/functions/twelve-pack"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
